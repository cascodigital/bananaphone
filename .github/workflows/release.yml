name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone app (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name BananaPhone
          --icon assets/bananaphone.ico
          --add-data "assets;assets"
          --collect-all customtkinter
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all av
          --hidden-import tokenizers
          bananaphone.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version packaging\installer.iss
          Compress-Archive -Path dist\BananaPhone\* -DestinationPath "BananaPhone-Portable-$version.zip" -Force
          pyinstaller --noconfirm --clean --console --onedir `
            --name BananaPhone-Debug `
            --icon assets/bananaphone.ico `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all av `
            --hidden-import tokenizers `
            bananaphone.py
          Compress-Archive -Path dist\BananaPhone-Debug\* -DestinationPath "BananaPhone-Debug-Console-$version.zip" -Force
          $sourceRoot = "BananaPhone-Source-$version"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          Copy-Item bananaphone.py,requirements.txt,install_windows.ps1,Install-BananaPhone.bat,Run-BananaPhone.bat,README_WINDOWS.md,LICENSE -Destination $sourceRoot
          Copy-Item assets -Destination $sourceRoot -Recurse
          Copy-Item docs -Destination $sourceRoot -Recurse
          Compress-Archive -Path "$sourceRoot\*" -DestinationPath "BananaPhone-Source-$version.zip" -Force
          Get-FileHash "packaging\Output\BananaPhone-Setup-$version.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  BananaPhone-Setup-$version.exe" } |
            Set-Content "BananaPhone-Setup-$version.exe.sha256"
          Get-FileHash "BananaPhone-Portable-$version.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  BananaPhone-Portable-$version.zip" } |
            Set-Content "BananaPhone-Portable-$version.zip.sha256"
          Get-FileHash "BananaPhone-Debug-Console-$version.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  BananaPhone-Debug-Console-$version.zip" } |
            Set-Content "BananaPhone-Debug-Console-$version.zip.sha256"
          Get-FileHash "BananaPhone-Source-$version.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  BananaPhone-Source-$version.zip" } |
            Set-Content "BananaPhone-Source-$version.zip.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            packaging/Output/BananaPhone-Setup-*.exe
            BananaPhone-Portable-*.zip
            BananaPhone-Debug-Console-*.zip
            BananaPhone-Source-*.zip
            BananaPhone-*.sha256

  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libfuse2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone app (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name BananaPhone
          --add-data "assets:assets"
          --collect-all customtkinter
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all av
          --hidden-import tokenizers
          bananaphone.py

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/BananaPhone/* AppDir/usr/bin/
          cp packaging/bananaphone.desktop AppDir/
          cp assets/bananaphone-256.png AppDir/bananaphone.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/BananaPhone" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          version="${GITHUB_REF_NAME#v}"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir "BananaPhone-${version}-x86_64.AppImage"
          sha256sum "BananaPhone-${version}-x86_64.AppImage" > "BananaPhone-${version}-x86_64.AppImage.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            BananaPhone-*-x86_64.AppImage
            BananaPhone-*-x86_64.AppImage.sha256
