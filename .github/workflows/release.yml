name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone app (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name SaySense
          --icon assets/bananaphone.ico
          --collect-all customtkinter
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all av
          --hidden-import tokenizers
          bananaphone_v2.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version packaging\installer.iss
          Compress-Archive -Path dist\SaySense\* -DestinationPath "SaySense-Portable-$version.zip" -Force
          pyinstaller --noconfirm --clean --console --onedir `
            --name SaySense-Debug `
            --icon assets/bananaphone.ico `
            --collect-all customtkinter `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all av `
            --hidden-import tokenizers `
            bananaphone_v2.py
          Compress-Archive -Path dist\SaySense-Debug\* -DestinationPath "SaySense-Debug-Console-$version.zip" -Force
          $sourceRoot = "SaySense-Source-$version"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          Copy-Item bananaphone_v2.py,requirements.txt,install_windows.ps1,Install-SaySense.bat,Run-SaySense.bat,README_WINDOWS.md,LICENSE -Destination $sourceRoot
          Copy-Item assets -Destination $sourceRoot -Recurse
          Copy-Item docs -Destination $sourceRoot -Recurse
          Compress-Archive -Path "$sourceRoot\*" -DestinationPath "SaySense-Source-$version.zip" -Force
          Get-FileHash "packaging\Output\SaySense-Setup-$version.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  SaySense-Setup-$version.exe" } |
            Set-Content "SaySense-Setup-$version.exe.sha256"
          Get-FileHash "SaySense-Portable-$version.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  SaySense-Portable-$version.zip" } |
            Set-Content "SaySense-Portable-$version.zip.sha256"
          Get-FileHash "SaySense-Debug-Console-$version.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  SaySense-Debug-Console-$version.zip" } |
            Set-Content "SaySense-Debug-Console-$version.zip.sha256"
          Get-FileHash "SaySense-Source-$version.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  SaySense-Source-$version.zip" } |
            Set-Content "SaySense-Source-$version.zip.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            packaging/Output/SaySense-Setup-*.exe
            SaySense-Portable-*.zip
            SaySense-Debug-Console-*.zip
            SaySense-Source-*.zip
            SaySense-*.sha256

  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libfuse2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone app (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name SaySense
          --collect-all customtkinter
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all av
          --hidden-import tokenizers
          bananaphone_v2.py

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/SaySense/* AppDir/usr/bin/
          cp packaging/saysense.desktop AppDir/
          cp assets/bananaphone-256.png AppDir/saysense.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/SaySense" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          version="${GITHUB_REF_NAME#v}"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir "SaySense-${version}-x86_64.AppImage"
          sha256sum "SaySense-${version}-x86_64.AppImage" > "SaySense-${version}-x86_64.AppImage.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            SaySense-*-x86_64.AppImage
            SaySense-*-x86_64.AppImage.sha256
